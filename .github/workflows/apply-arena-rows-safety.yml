name: Apply arena_rows safety fix

on:
  push:
    branches:
      - fix/reentrancy-memory-safety
    paths:
      - .github/workflows/apply-arena-rows-safety.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reentrancy-memory-safety
      - name: Verify base and apply patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object HC/hc_core.c)" = "942805cf04ed2218cfc0a1923d36b6e25f415446"
          echo '' | base64 -d > /tmp/arena.patch
          git apply --check /tmp/arena.patch
          git apply /tmp/arena.patch
          git diff --check
          ! grep -F 'return (char (*)[HC_VAL])g_apanic' HC/hc_core.c
          cc -std=gnu99 -IHC -c HC/hc_core.c -o /tmp/hc_core.o
      - name: Commit tested patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-arena-rows-safety.yml
          git add HC/hc_core.c
          git commit -m "Make arena row allocation fail safely"
          git push origin HEAD:fix/reentrancy-memory-safety
