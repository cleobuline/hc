# Le noyau de HC et sa suite de non-régression, à chaque poussée.
#
# L'application a besoin de Cocoa et se construit dans Xcode ; le noyau, lui,
# est du C99 pur. C'est précisément ce qui permet de le vérifier ici, sur une
# machine sans AppKit, en moins d'une minute.
name: noyau

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    name: suite de non-régression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: le noyau compile
        run: make verifie

      - name: avertissements du compilateur
        run: make avertissements

      - name: suite de non-régression
        run: make test

  sanitizers:
    name: mémoire et comportement indéfini
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La même suite, recompilée sous AddressSanitizer et UBSan. Plus lente,
      # d'où un travail séparé : un échec ici ne cache pas un échec là-bas.
      - name: suite sous ASan + UBSan
        run: make test-asan

  cocoa:
    # LES QUINZE FICHIERS .m N'ÉTAIENT COMPILÉS NULLE PART.
    #
    # Les deux travaux ci-dessus vérifient le noyau, qui est du C99 pur. Toute
    # l'interface — la vue, les palettes, le document, l'éditeur d'icônes — ne
    # passait sous aucun compilateur avant qu'un humain n'ouvre Xcode. Deux
    # erreurs ont déjà été découvertes ainsi, et non par la CI : un sélecteur
    # AppKit qui n'existe pas (invalidateCursorRects: au lieu de
    # invalidateCursorRectsForView:) et un pointeur __autoreleasing sous ARC.
    # Ce sont des erreurs de COMPILATION, exactement ce qu'une CI doit voir.
    #
    # L'application n'est ni signée ni lancée : il s'agit de compiler. La
    # signature demande une équipe de développement, qu'une machine
    # d'intégration n'a pas, et lancer une application Cocoa demanderait une
    # session graphique.
    name: interface Cocoa
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: l'application compile
        run: |
          xcodebuild \
            -project HC.xcodeproj \
            -target HC \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            build
