name: Apply delete safety fix

on:
  push:
    branches:
      - fix/reentrancy-memory-safety
    paths:
      - .github/workflows/apply-delete-safety-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reentrancy-memory-safety
      - name: Verify base and apply patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object HC/hc_core.c)" = "ddfc73f4829a5c646164d26b7a1cef70cec7b359"
          echo '' | base64 -d > /tmp/delete.patch
          git apply --check /tmp/delete.patch
          git apply /tmp/delete.patch
          git diff --check
          cc -std=gnu99 -IHC -c HC/hc_core.c -o /tmp/hc_core.o
      - name: Commit tested patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-delete-safety-fix.yml
          git add HC/hc_core.c
          git commit -m "Make object deletion reentrancy-safe"
          git push origin HEAD:fix/reentrancy-memory-safety
